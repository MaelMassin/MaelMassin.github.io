<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Scène 3D — Monolithe Mystique</title>

  <!-- A-Frame (desktop) -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- Model-Viewer (mobile) -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #070c18;
      touch-action: none;
      font-family: 'Segoe UI', sans-serif;
    }

    /* ───── Overlay de démarrage (desktop) ───── */
    #click-to-start {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(5, 8, 20, 0.80);
      backdrop-filter: blur(8px);
      color: #e0f2fe;
      z-index: 999;
      cursor: pointer;
      transition: opacity 0.4s ease;
    }
    #click-to-start .icon { font-size: 2.8rem; animation: pulse 1.6s ease-in-out infinite; }
    #click-to-start p     { font-size: 1rem; font-weight: 600; }
    #click-to-start small { font-size: 0.75rem; opacity: 0.6; }
    @keyframes pulse {
      0%, 100% { transform: scale(1);    opacity: 1;   }
      50%       { transform: scale(1.18); opacity: 0.65; }
    }

    /* ───── Viewer mobile (model-viewer) ───── */
    #mobile-viewer {
      display: none;
      width: 100%;
      height: 100%;
      background: #070c18;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: #070c18;
      --poster-color: #070c18;
    }


    /* ───── Viewer desktop (A-Frame) ───── */
    #desktop-viewer {
      display: none;
      width: 100%;
      height: 100%;
      position: relative;
    }
    a-scene { width: 100% !important; height: 100% !important; }
  </style>
</head>
<body>

  <!-- ═══════════════════════════════════════════
       VIEWER MOBILE : model-viewer (tactile)
  ═══════════════════════════════════════════ -->
  <div id="mobile-viewer">
    <model-viewer
      id="mv"
      src="scene_monolithe_mystique.glb"
      alt="Scène 3D — Monolithe Mystique"
      camera-controls
      auto-rotate
      auto-rotate-delay="2000"
      rotation-per-second="15deg"
      shadow-intensity="1"
      environment-image="neutral"
      touch-action="pan-y"
      interaction-prompt="none">
    </model-viewer>
  </div>

  <!-- ═══════════════════════════════════════════
       VIEWER DESKTOP : A-Frame (navigation libre)
  ═══════════════════════════════════════════ -->

  <!-- Overlay clique pour activer pointer lock -->
  <div id="click-to-start" onclick="activateDesktop()">
    <div class="icon">🖱️</div>
    <p>Cliquez pour explorer la scène</p>
    <small>ZQSD + souris pour naviguer — Échap pour quitter</small>
  </div>

  <div id="desktop-viewer">
    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      renderer="antialias: true; colorManagement: true;"
      background="color: #070c18">

      <a-assets>
        <a-asset-item id="monolithe" src="scene_monolithe_mystique.glb" response-type="arraybuffer"></a-asset-item>
      </a-assets>

      <a-gltf-model src="#monolithe" position="0 0 0" scale="1 1 1"></a-gltf-model>

      <a-light type="ambient"     color="#c9e8ff" intensity="0.6"></a-light>
      <a-light type="directional" color="#ffffff"  intensity="0.8" position="2 4 -1"></a-light>

      <a-entity id="rig" position="0 1.6 0">
        <a-camera
          id="camera"
          wasd-controls="acceleration: 15; fly: false"
          look-controls="enabled: false; pointerLockEnabled: true"
          near="0.05">
        </a-camera>
      </a-entity>
    </a-scene>
  </div>

  <script>
    // ── Détection mobile ──
    const isMobile = window.matchMedia('(max-width: 768px)').matches
      || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
      || ('ontouchstart' in window && navigator.maxTouchPoints > 1);

    // ── Afficher le bon viewer ──
    if (isMobile) {
      document.getElementById('click-to-start').style.display = 'none';
      document.getElementById('mobile-viewer').style.display  = 'block';
    } else {
      document.getElementById('desktop-viewer').style.display = 'block';
      // L'overlay desktop est déjà visible par défaut
    }

    // ── Activation Desktop (pointer lock) ──
    function activateDesktop() {
      const overlay = document.getElementById('click-to-start');
      overlay.style.opacity = '0';
      setTimeout(() => overlay.style.display = 'none', 400);

      const camera = document.getElementById('camera');
      camera.setAttribute('look-controls', 'enabled: true; pointerLockEnabled: true');

      const canvas = document.querySelector('a-scene').canvas;
      if (canvas && canvas.requestPointerLock) canvas.requestPointerLock();
    }

    // ── Réaffiche l'overlay si Échap pressé ──
    document.addEventListener('pointerlockchange', () => {
      if (!document.pointerLockElement) {
        const camera = document.getElementById('camera');
        if (camera) camera.setAttribute('look-controls', 'enabled: false');

        const overlay = document.getElementById('click-to-start');
        if (overlay) {
          overlay.style.display  = 'flex';
          overlay.style.opacity  = '1';
        }
      }
    });
  </script>

</body>
</html>
